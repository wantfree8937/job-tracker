# ============================================================
# Job Tracker CI — push/PR마다 자동 실행
# ① 시크릿 스캔 (gitleaks) ② 백엔드 테스트 ③ 프론트 테스트·빌드
# ④ Docker 이미지 빌드 검증
# ============================================================
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # ① 커밋된 시크릿 감지 (API 키 노출 방지)
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 전체 히스토리 스캔
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ② 백엔드: JUnit + JaCoCo 커버리지
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: 백엔드 테스트 (H2 격리)
        run: mvn -B test
      - name: JaCoCo 리포트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

  # ③ 프론트: Vitest + TypeScript 빌드
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        run: npm ci
      - name: 프론트 테스트 (Vitest)
        run: npm test
      - name: 프론트 빌드 (tsc + vite)
        run: npm run build

  # ④ Docker 이미지가 실제로 빌드되는지 검증
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker 이미지 빌드 검증
        run: docker build -t job-tracker .
