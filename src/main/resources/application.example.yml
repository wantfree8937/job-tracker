spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/job_tracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    # JWT 서명용 비밀키 (운영 환경에서는 반드시 환경변수로 교체)
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000  # 24시간

server:
  port: 8080
