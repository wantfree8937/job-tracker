spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:job_tracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    # JWT 서명용 비밀키 (운영 환경에서는 반드시 환경변수로 교체)
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000  # 24시간

opencode-go:
  # opencode-go 구독 API 키 (환경변수로만 주입, 하드코딩 금지)
  api-key: ${OPENCODE_GO_API_KEY:}
  base-url: https://opencode.ai/zen/go/v1

server:
  port: 8080
