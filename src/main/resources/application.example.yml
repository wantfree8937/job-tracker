spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:job_tracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10       # 크롤링을 트랜잭션 밖으로 분리해 커넥션 점유 시간이 짧아짐 → 여유 확보 (5 → 10)
      minimum-idle: 1
      connection-timeout: 5000    # 크롤링 분리 후에도 여유 있게 (3초 → 5초)
      validation-timeout: 1000
      max-lifetime: 240000        # Render Postgres 유휴 커넥션 정리보다 짧게 (stale 커넥션 방지)
      keepalive-time: 120000      # 2분마다 keepalive — 죽은 커넥션 미리 감지
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000  # 60초 이상 미반환 = 누수 의심 로그
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    # JWT 서명용 비밀키 (운영 환경에서는 반드시 환경변수로 교체)
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000  # 24시간

opencode-go:
  # opencode-go 구독 API 키 (환경변수로만 주입, 하드코딩 금지)
  api-key: ${OPENCODE_GO_API_KEY:}
  base-url: https://opencode.ai/zen/go/v1

server:
  port: 8080
