spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:job_tracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    # JWT 서명용 비밀키 (운영 환경에서는 반드시 환경변수로 교체)
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000  # 24시간

deepseek:
  # 딥시크 API 키 (환경변수로만 주입, 하드코딩 금지)
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com

server:
  port: 8080
